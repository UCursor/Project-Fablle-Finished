    <script>
      (function() {
        try {
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set) {
            let activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(fn) { activeFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore if environment locks property definition
        }
      })();
    </script>
